name: Viewer builds
on: [push, pull_request]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake pkg-config libasound2-dev libfontconfig1-dev libfreetype-dev libx11-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libxcb-xkb-dev libxcb-shape0-dev libxcb-xfixes0-dev libwayland-dev libvulkan-dev libzstd-dev libssl-dev
      - if: runner.os == 'macOS'
        run: xcodebuild -downloadComponent MetalToolchain
      - run: npm ci
      - run: npm ci --prefix web
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm run setup:proxy
      - run: npm test
      - run: npm --prefix web run build
      - run: cargo test --locked
      - run: cargo build --locked
