[package]
name = "maestro-viewer"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui = "0.2.2"
gpui-component = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
rust-embed = "8"
regex = "1"
tempfile = "3"

[profile.dev]
debug = 0

# zed-async-tar pins xattr 0.2, which references a removed Linux libc alias.
[patch.crates-io]
xattr = { path = "compat/xattr" }
